buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Keep aligned with the Qt 6.11.1 Android package template.
        classpath 'com.android.tools.build:gradle:9.0.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0"
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: qtGradlePluginType

// Keep update identity outside disposable SDK/build directories. Never silently
// fall back to Gradle's automatically generated debug keystore.
def signingProfile = file(System.getenv('QSAN_ANDROID_SIGNING_PROPERTIES') ?:
        new File(System.getProperty('user.home'), '.qsanguosha/android-signing.properties').path)
def persistentSigning = new Properties()
if (signingProfile.isFile()) {
    signingProfile.withInputStream { persistentSigning.load(it) }
}
def persistentKey = file(persistentSigning.getProperty('storeFile',
        new File(System.getProperty('user.home'), '.qsanguosha/signing/android-debug.keystore').path))

def verifyPersistentDebugSigning = tasks.register('verifyPersistentDebugSigning') {
    doLast {
        if (!signingProfile.isFile() || !persistentKey.isFile()) {
            throw new GradleException('Persistent Android signing profile/key missing; restore the existing key. See docs/android-build.md.')
        }
        def expected = persistentSigning.getProperty('certificateSha256', '').toLowerCase(Locale.ROOT)
        def keyStore = java.security.KeyStore.getInstance(persistentKey,
                persistentSigning.getProperty('storePassword', 'android').toCharArray())
        def certificate = keyStore.getCertificate(persistentSigning.getProperty('keyAlias', 'androiddebugkey'))
        def actual = certificate == null ? '' : java.security.MessageDigest.getInstance('SHA-256')
                .digest(certificate.encoded).encodeHex().toString()
        if (!(expected ==~ /[0-9a-f]{64}/) || actual != expected) {
            throw new GradleException('Android signing certificate mismatch; refusing an APK that cannot replace the installed app.')
        }
    }
}
tasks.matching { it.name == 'validateSigningDebug' }.configureEach {
    dependsOn verifyPersistentDebugSigning
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.window:window-java:1.5.1'
}

android {
    signingConfigs {
        debug {
            storeFile persistentKey
            storePassword persistentSigning.getProperty('storePassword', 'android')
            keyAlias persistentSigning.getProperty('keyAlias', 'androiddebugkey')
            keyPassword persistentSigning.getProperty('keyPassword', 'android')
        }
    }
    namespace = androidPackageName
    compileSdkVersion androidCompileSdkVersion
    buildToolsVersion androidBuildToolsVersion
    ndkVersion = androidNdkVersion

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            kotlin.srcDirs = [qtAndroidDir + '/src', 'src', 'kotlin']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
        options.compilerArgs += ['-Xlint:all']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        abortOnError = false
    }

    aaptOptions {
        noCompress 'rcc'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = legacyPackaging
        }
    }

    defaultConfig {
        resConfig "en"
        minSdkVersion qtMinSdkVersion
        targetSdkVersion qtTargetSdkVersion
        ndk.abiFilters = qtTargetAbiList.split(",")
    }
}

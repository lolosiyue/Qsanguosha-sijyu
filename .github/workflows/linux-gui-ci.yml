name: Linux GUI CI

on:
  pull_request:
    branches:
      - main
      - debug
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - '*.md'
  push:
    branches:
      - main
      - debug
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-gui-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  # 分層:compile -> M1 startup -> M2 network 2p -> M2 network 5p。
  # 後面的 job 用 artifact 收下前面砌好的 binary 與 runtime Lua 內容,唔重複 build,
  # 亦唔會因為重新 fetch extensions 而換咗內容 — 跑網絡局的就係編譯 job 驗過的
  # 同一份檔案。
  gui-compile:
    name: Linux GUI compile + M1 runtime startup smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      # GUI 的 Qt baseline 與 Windows 一致（6.11.1）。Ubuntu 24.04 apt 只有 Qt 6.4.2，
      # 缺少 GUI source 需要的 API（例如 QStyleHints::colorScheme()，Qt 6.5+）。
      # dedicated server 不受影響，linux-server-ci.yml 繼續用 distro Qt。
      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qt5compat qtmultimedia'
          cache: true
          cache-key-prefix: qt-ubuntu-24.04-x64-6.11.1-linux_gcc_64-qt5compat-qtmultimedia-aqtmaster16db45a7-v1
          # aqt 3.3.0 (最新 release) 不支援 Qt 6.11+ 的新 repo 目錄結構 (miurahr/aqtinstall#959)。
          # 修復已合併至 master 但未發佈；固定到此 commit 以取得 Qt 6.11+ 支援。
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            g++ \
            libfreetype-dev \
            libgl-dev \
            ninja-build \
            python3-venv

      - name: Install pinned SWIG
        run: |
          python3 -m venv "$RUNNER_TEMP/qsanguosha-ci-venv"
          "$RUNNER_TEMP/qsanguosha-ci-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            -r tools/ci/requirements.txt
          echo "$RUNNER_TEMP/qsanguosha-ci-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/qsanguosha-ci-venv/bin/swig" -version

      - name: Fetch Lua AI and extensions
        run: bash tools/ci/fetch-extensions.sh "$GITHUB_WORKSPACE"

      - name: Configure GUI build with GCC
        run: |
          cmake -S . -B build/linux-gui-gcc -G Ninja \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DQSAN_BUILD_GUI=ON \
            -DQSAN_BUILD_SERVER=ON

      - name: Compile and link QSanguosha
        run: cmake --build build/linux-gui-gcc --target QSanguosha --parallel

      - name: Verify the linked executable
        run: |
          test -x relwithdebinfo/QSanguosha
          file relwithdebinfo/QSanguosha
          ldd relwithdebinfo/QSanguosha | tee ldd.txt
          if grep -q 'not found' ldd.txt; then
            echo "Missing shared library dependency" >&2
            exit 1
          fi

      # M0 只驗證 binary 可以執行並回報 capability。--local-response-ui-capabilities
      # 喺建立 QApplication 之前就直接回傳 JSON，所以呢個係 binary capability smoke，
      # 唔係 GUI／offscreen startup smoke。真正的 QApplication／MainWindow／HomeScene
      # 啟動驗證由下面的 M1 runtime startup smoke 負責。
      - name: Binary capability smoke
        run: |
          ./relwithdebinfo/QSanguosha --local-response-ui-capabilities | tee capabilities.json
          python3 - capabilities.json <<'PY'
          import json
          import sys

          payload = json.loads(open(sys.argv[1], encoding="utf-8").read())
          missing = [key for key in ("auto", "show", "inspect") if not payload.get(key)]
          if missing:
              raise SystemExit(f"local response UI capabilities not advertised: {missing}")
          print("local response UI capabilities OK")
          PY

      # ---------------------------------------------------------------------
      # Linux GUI M1：真正的 GUI runtime startup
      # ---------------------------------------------------------------------

      # 只補 Qt xcb platform plugin 同 software OpenGL 實際需要的 runtime library，
      # 唔裝完整 desktop environment。
      - name: Install Linux GUI runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fonts-dejavu-core \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            xauth \
            xvfb

      - name: Report GUI runtime environment
        run: |
          mkdir -p gui-runtime-artifacts
          {
            echo "== OS =="
            . /etc/os-release && echo "$PRETTY_NAME"
            uname -a
            echo
            echo "== Qt =="
            qmake6 -query 2>/dev/null || "$QT_ROOT_DIR/bin/qmake" -query 2>/dev/null || true
            echo
            echo "== Xvfb / X =="
            Xvfb -version 2>&1 | head -n 2 || true
            xvfb-run --help 2>&1 | head -n 1 || true
            echo
            echo "== Mesa / OpenGL =="
            dpkg -l 'libgl1*' 'libglx-mesa0' 2>/dev/null | tail -n +6 || true
            echo
            echo "== Qt platform plugins =="
            ls "$QT_ROOT_DIR/plugins/platforms" 2>/dev/null || true
            echo
            echo "== Environment =="
            echo "DISPLAY=${DISPLAY:-<unset>}"
            echo "WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-<unset>}"
            echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-<unset>}"
            echo "QT_ROOT_DIR=${QT_ROOT_DIR:-<unset>}"
          } | tee gui-runtime-artifacts/environment.txt

      # M1 的主驗證：Xvfb + xcb platform plugin，即係真正開 native window 的路徑。
      # offscreen 唔可以當作 M1 的唯一證據。
      - name: Linux GUI M1 runtime startup smoke (Xvfb, xcb)
        run: |
          bash tools/ci/linux-gui-startup-smoke.sh \
            ./relwithdebinfo/QSanguosha \
            gui-runtime-artifacts \
            --platform xcb \
            --label xvfb-xcb \
            --timeout-ms 45000 \
            --process-timeout 120

      # 次要 smoke：確認完全冇 X server 時亦啟動得到，方便日後 container 場景。
      - name: Linux GUI M1 startup smoke (offscreen, secondary)
        run: |
          bash tools/ci/linux-gui-startup-smoke.sh \
            ./relwithdebinfo/QSanguosha \
            gui-runtime-artifacts \
            --platform offscreen \
            --label offscreen \
            --no-xvfb \
            --timeout-ms 45000 \
            --process-timeout 120

      # 負向契約：app 內部 timeout 一定要回非零 exit code 同 timeout result marker，
      # 而唔係靜靜掛住等 runner 斬。
      - name: Startup smoke timeout contract
        run: |
          bash tools/ci/linux-gui-startup-smoke.sh \
            ./relwithdebinfo/QSanguosha \
            gui-runtime-artifacts \
            --platform offscreen \
            --label timeout-contract \
            --no-xvfb \
            --timeout-ms 100 \
            --process-timeout 120 \
            --expect fail \
            --expect-reason timeout

      - name: Upload GUI runtime artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-gui-m1-runtime
          path: |
            gui-runtime-artifacts/
            capabilities.json
            ldd.txt
          if-no-files-found: warn
          retention-days: 7

      # M2 的網絡 job 要用同一份 binary 同同一份 runtime Lua 內容。lua/ 與
      # extensions/ 一併打包,而唔係喺下游 job 重新 fetch:extensions 的預設 ref 係
      # 可動的 main,重新 fetch 會令兩個 job 的內容有機會唔一樣,咁就唔係同一個
      # 可重現的組合。
      - name: Record the fetched extensions commit
        run: |
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > build-provenance.txt
          {
            echo "repo_commit=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "qt_version=6.11.1"
            echo "build_type=RelWithDebInfo"
            echo "client_sha256=$(sha256sum relwithdebinfo/QSanguosha | cut -d' ' -f1)"
            echo "server_sha256=$(sha256sum relwithdebinfo/qsanguosha_server | cut -d' ' -f1)"
          } | tee build-provenance.txt

      - name: Upload the Linux GUI runtime bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-gui-runtime-bundle
          path: |
            relwithdebinfo/QSanguosha
            relwithdebinfo/qsanguosha_server
            lua/
            extensions/
            build-provenance.txt
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------
  # Linux GUI M2:真實 TCP 網絡對局
  # ---------------------------------------------------------------------
  gui-network-2p:
    name: Linux GUI M2 network game (02p, 2 players)
    needs: gui-compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # 固定 seed:同一個 commit + 同一個 seed 應該重現同一副牌局起手。
      # 換 seed 等於換測試案例,要連同 artifact 一齊記錄。
      QSAN_M2_SEED: '20260828'
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qt5compat qtmultimedia'
          cache: true
          cache-key-prefix: qt-ubuntu-24.04-x64-6.11.1-linux_gcc_64-qt5compat-qtmultimedia-aqtmaster16db45a7-v1
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'

      - name: Install Linux GUI runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fonts-dejavu-core \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            xauth \
            xvfb

      - name: Download the Linux GUI runtime bundle
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v7.0.0
        with:
          name: linux-gui-runtime-bundle

      - name: Restore executable bits and report provenance
        run: |
          chmod +x relwithdebinfo/QSanguosha relwithdebinfo/qsanguosha_server
          cat build-provenance.txt
          sha256sum relwithdebinfo/QSanguosha relwithdebinfo/qsanguosha_server

      - name: Linux GUI M2 network game (02p)
        run: |
          python3 tools/autotest/gui_network_smoke.py \
            --exe-root . \
            --mode 02p \
            --seed "$QSAN_M2_SEED" \
            --artifact-dir gui-network-artifacts \
            --xvfb --platform xcb \
            --process-timeout 900 \
            --client-timeout-ms 600000 \
            --require-interactions choose_general

      # 負向契約:server 未啟動時,runner 一定要快速失敗並講清楚係連線層,
      # 唔可以靜靜等到 timeout 或者當成 PASS。
      - name: Network smoke fails fast when the server is unreachable
        run: |
          set +e
          python3 tools/autotest/gui_network_smoke.py \
            --exe-root . \
            --server-exe /bin/true \
            --mode 02p \
            --seed "$QSAN_M2_SEED" \
            --artifact-dir gui-network-artifacts \
            --label 02p-no-server \
            --xvfb --platform xcb \
            --server-startup-timeout 20 \
            --process-timeout 120 \
            --client-timeout-ms 60000 > no-server.log 2>&1
          status=$?
          set -e
          cat no-server.log
          if [ "$status" -eq 0 ]; then
            echo "The runner passed with no server listening" >&2
            exit 1
          fi
          grep -q "never started listening" no-server.log

      - name: Upload M2 network artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-gui-m2-network-02p
          path: |
            gui-network-artifacts/
            build-provenance.txt
            no-server.log
          if-no-files-found: warn
          retention-days: 7

  gui-network-5p:
    name: Linux GUI M2 network game (05p, 5 players)
    needs: gui-network-2p
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QSAN_M2_SEED: '20260828'
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qt5compat qtmultimedia'
          cache: true
          cache-key-prefix: qt-ubuntu-24.04-x64-6.11.1-linux_gcc_64-qt5compat-qtmultimedia-aqtmaster16db45a7-v1
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'

      - name: Install Linux GUI runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fonts-dejavu-core \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            xauth \
            xvfb

      - name: Download the Linux GUI runtime bundle
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v7.0.0
        with:
          name: linux-gui-runtime-bundle

      - name: Restore executable bits and report provenance
        run: |
          chmod +x relwithdebinfo/QSanguosha relwithdebinfo/qsanguosha_server
          cat build-provenance.txt

      - name: Linux GUI M2 network game (05p)
        run: |
          python3 tools/autotest/gui_network_smoke.py \
            --exe-root . \
            --mode 05p \
            --seed "$QSAN_M2_SEED" \
            --artifact-dir gui-network-artifacts \
            --xvfb --platform xcb \
            --process-timeout 1800 \
            --client-timeout-ms 1500000 \
            --require-interactions choose_general

      - name: Upload M2 network artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-gui-m2-network-05p
          path: |
            gui-network-artifacts/
            build-provenance.txt
          if-no-files-found: warn
          retention-days: 7

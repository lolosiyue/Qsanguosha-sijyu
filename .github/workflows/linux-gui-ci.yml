name: Linux GUI CI

on:
  pull_request:
    branches:
      - main
      - debug
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/client/**'
      - '!src/client/core/**'
      - 'src/core/audio.h'
      - 'src/core/json-gui.cpp'
      - 'src/core/oracle_helper.*'
      - 'src/core/record-analysis.*'
      - 'src/core/settings-gui.*'
      - 'src/dialog/**'
      - 'src/main.cpp'
      - 'src/pch.h'
      - 'src/spine/**'
      - 'src/ui/**'
      - 'src/util/**'
      - 'qml/**'
      - 'resource/**'
      - 'tools/ci/fetch-extensions.sh'
      - 'tools/ci/requirements.txt'
      - 'tools/ci/linux-gui-*.sh'
      - 'tools/ci/make-effects-fixtures.py'
      - 'tools/ci/make-media-fixtures.py'
      - 'tools/ci/validate-effects-smoke.py'
      - 'tools/ci/validate-multimedia-smoke.py'
      - 'tools/ci/validate-ui-startup-smoke.py'
      - 'tests/fixtures/effects/**'
      - 'tests/fixtures/media/**'
      - '.github/workflows/linux-gui-ci.yml'
  push:
    branches:
      - main
      - debug
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/client/**'
      - '!src/client/core/**'
      - 'src/core/audio.h'
      - 'src/core/json-gui.cpp'
      - 'src/core/oracle_helper.*'
      - 'src/core/record-analysis.*'
      - 'src/core/settings-gui.*'
      - 'src/dialog/**'
      - 'src/main.cpp'
      - 'src/pch.h'
      - 'src/spine/**'
      - 'src/ui/**'
      - 'src/util/**'
      - 'qml/**'
      - 'resource/**'
      - 'tools/ci/fetch-extensions.sh'
      - 'tools/ci/requirements.txt'
      - 'tools/ci/linux-gui-*.sh'
      - 'tools/ci/make-effects-fixtures.py'
      - 'tools/ci/make-media-fixtures.py'
      - 'tools/ci/validate-effects-smoke.py'
      - 'tools/ci/validate-multimedia-smoke.py'
      - 'tools/ci/validate-ui-startup-smoke.py'
      - 'tests/fixtures/effects/**'
      - 'tests/fixtures/media/**'
      - '.github/workflows/linux-gui-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-gui-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  QSAN_FULL_GUI_CI: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  # 日常 GUI 路徑只跑 compile -> M1 Xvfb startup；main／手動先展開
  # offscreen／負向契約 -> M2B-A multimedia -> M2B-B effects matrix。
  # 後面的 job 用 artifact 收下前面砌好的 binary 與 runtime Lua 內容,唔重複 build,
  # 亦唔會因為重新 fetch extensions 而換咗內容 — 跑 multimedia 的就係編譯 job
  # 驗過的同一份檔案。
  #
  # GUI 對局(M2 network game)刻意唔喺 CI 跑:見 AGENTS.md「GUI runtime 唔入 CI」。
  # runner 本身(tools/autotest/gui_network_smoke.py)保留,喺本機齊資產環境下跑。
  gui-compile:
    name: Linux GUI compile + M1 runtime startup smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      # GUI 的 Qt baseline 與 Windows 一致（6.11.1）。Ubuntu 24.04 apt 只有 Qt 6.4.2，
      # 缺少 GUI source 需要的 API（例如 QStyleHints::colorScheme()，Qt 6.5+）。
      # dedicated server 不受影響，linux-server-ci.yml 繼續用 distro Qt。
      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qt5compat qtmultimedia'
          cache: true
          cache-key-prefix: qt-ubuntu-24.04-x64-6.11.1-linux_gcc_64-qt5compat-qtmultimedia-aqtmaster16db45a7-v1
          # aqt 3.3.0 (最新 release) 不支援 Qt 6.11+ 的新 repo 目錄結構 (miurahr/aqtinstall#959)。
          # 修復已合併至 master 但未發佈；固定到此 commit 以取得 Qt 6.11+ 支援。
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            g++ \
            libfreetype-dev \
            libgl-dev \
            ninja-build \
            python3-venv

      - name: Install pinned SWIG
        run: |
          python3 -m venv "$RUNNER_TEMP/qsanguosha-ci-venv"
          "$RUNNER_TEMP/qsanguosha-ci-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            -r tools/ci/requirements.txt
          echo "$RUNNER_TEMP/qsanguosha-ci-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/qsanguosha-ci-venv/bin/swig" -version

      - name: Fetch Lua AI and extensions
        run: bash tools/ci/fetch-extensions.sh "$GITHUB_WORKSPACE"

      - name: Configure GUI build with GCC
        run: |
          cmake -S . -B build/linux-gui-gcc -G Ninja \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DQSAN_BUILD_GUI=ON \
            -DQSAN_BUILD_SERVER=ON

      - name: Compile and link QSanguosha
        run: cmake --build build/linux-gui-gcc --target QSanguosha --parallel

      - name: Verify the linked executable
        run: |
          if [ ! -x relwithdebinfo/QSanguosha ]; then
            echo "Expected executable is missing: relwithdebinfo/QSanguosha" >&2
            exit 1
          fi
          file relwithdebinfo/QSanguosha
          ldd relwithdebinfo/QSanguosha | tee ldd.txt
          if grep -q 'not found' ldd.txt; then
            echo "Missing shared library dependency" >&2
            exit 1
          fi

      # M0 只驗證 binary 可以執行並回報 capability。--local-response-ui-capabilities
      # 喺建立 QApplication 之前就直接回傳 JSON，所以呢個係 binary capability smoke，
      # 唔係 GUI／offscreen startup smoke。真正的 QApplication／MainWindow／HomeScene
      # 啟動驗證由下面的 M1 runtime startup smoke 負責。
      - name: Binary capability smoke
        run: |
          ./relwithdebinfo/QSanguosha --local-response-ui-capabilities | tee capabilities.json
          python3 - capabilities.json <<'PY'
          import json
          import sys

          payload = json.loads(open(sys.argv[1], encoding="utf-8").read())
          missing = [key for key in ("auto", "show", "inspect") if not payload.get(key)]
          if missing:
              raise SystemExit(f"local response UI capabilities not advertised: {missing}")
          print("local response UI capabilities OK")
          PY

      # 缺資產診斷（M3）。clean checkout 冇美術／音訊／首頁圖示，所以下面
      # 每個 GUI job 都會刷一批 "QML Image: Cannot open" 同 "could not be
      # loaded" warning。呢個步驟喺佢哋出現之前先講清楚「邊啲係預期缺失」，
      # 令嗰批 warning 由查極都唔知係咩，變成一份對得上嘅清單。
      #
      # 資產清單由 CMake 產生喺 build directory（未 install，所以要明確指
      # 一份）。呢步唔係 gate：缺 optional 資產係正常，只有缺 required 先
      # 至代表個 tree 壞咗，嗰個由 packaging CI 把關。
      - name: Declare which optional assets are absent
        continue-on-error: true
        run: |
          mkdir -p gui-runtime-artifacts
          ./relwithdebinfo/QSanguosha --asset-report \
            --asset-manifest build/linux-gui-gcc/assets-manifest.json \
            >gui-runtime-artifacts/asset-report.json || true
          echo "(a non-zero exit above only means optional content is absent, which is expected here)"

      # ---------------------------------------------------------------------
      # Linux GUI M1：真正的 GUI runtime startup
      # ---------------------------------------------------------------------

      # 只補 Qt xcb platform plugin 同 software OpenGL 實際需要的 runtime library，
      # 唔裝完整 desktop environment。
      - name: Install Linux GUI runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fonts-dejavu-core \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            xauth \
            xvfb

      - name: Report GUI runtime environment
        run: |
          mkdir -p gui-runtime-artifacts
          {
            echo "== OS =="
            . /etc/os-release && echo "$PRETTY_NAME"
            uname -a
            echo
            echo "== Qt =="
            qmake6 -query 2>/dev/null || "$QT_ROOT_DIR/bin/qmake" -query 2>/dev/null || true
            echo
            echo "== Xvfb / X =="
            Xvfb -version 2>&1 | head -n 2 || true
            xvfb-run --help 2>&1 | head -n 1 || true
            echo
            echo "== Mesa / OpenGL =="
            dpkg -l 'libgl1*' 'libglx-mesa0' 2>/dev/null | tail -n +6 || true
            echo
            echo "== Qt platform plugins =="
            ls "$QT_ROOT_DIR/plugins/platforms" 2>/dev/null || true
            echo
            echo "== Environment =="
            echo "DISPLAY=${DISPLAY:-<unset>}"
            echo "WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-<unset>}"
            echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-<unset>}"
            echo "QT_ROOT_DIR=${QT_ROOT_DIR:-<unset>}"
          } | tee gui-runtime-artifacts/environment.txt

      # M1 的主驗證：Xvfb + xcb platform plugin，即係真正開 native window 的路徑。
      # offscreen 唔可以當作 M1 的唯一證據。
      - name: Linux GUI M1 runtime startup smoke (Xvfb, xcb)
        run: |
          bash tools/ci/linux-gui-startup-smoke.sh \
            ./relwithdebinfo/QSanguosha \
            gui-runtime-artifacts \
            --platform xcb \
            --label xvfb-xcb \
            --timeout-ms 45000 \
            --process-timeout 120

      # 次要 smoke：確認完全冇 X server 時亦啟動得到，方便日後 container 場景。
      - name: Linux GUI M1 startup smoke (offscreen, secondary)
        if: env.QSAN_FULL_GUI_CI == 'true'
        run: |
          bash tools/ci/linux-gui-startup-smoke.sh \
            ./relwithdebinfo/QSanguosha \
            gui-runtime-artifacts \
            --platform offscreen \
            --label offscreen \
            --no-xvfb \
            --timeout-ms 45000 \
            --process-timeout 120

      - name: Card Overview embedded scene smoke (offscreen)
        if: env.QSAN_FULL_GUI_CI == 'true'
        run: |
          bash tools/ci/linux-gui-startup-smoke.sh \
            ./relwithdebinfo/QSanguosha \
            gui-runtime-artifacts \
            --platform offscreen \
            --label cards-offscreen \
            --page cards \
            --no-xvfb \
            --timeout-ms 45000 \
            --process-timeout 120

      # 負向契約：app 內部 timeout 一定要回非零 exit code 同 timeout result marker，
      # 而唔係靜靜掛住等 runner 斬。
      - name: Startup smoke timeout contract
        if: env.QSAN_FULL_GUI_CI == 'true'
        run: |
          bash tools/ci/linux-gui-startup-smoke.sh \
            ./relwithdebinfo/QSanguosha \
            gui-runtime-artifacts \
            --platform offscreen \
            --label timeout-contract \
            --no-xvfb \
            --timeout-ms 100 \
            --process-timeout 120 \
            --expect fail \
            --expect-reason timeout

      - name: Upload GUI runtime artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-gui-m1-runtime
          path: |
            gui-runtime-artifacts/
            capabilities.json
            ldd.txt
          if-no-files-found: warn
          retention-days: 7

      # M2 的網絡 job 要用同一份 binary 同同一份 runtime Lua 內容。lua/ 與
      # extensions/ 一併打包,而唔係喺下游 job 重新 fetch:extensions 的預設 ref 係
      # 可動的 main,重新 fetch 會令兩個 job 的內容有機會唔一樣,咁就唔係同一個
      # 可重現的組合。
      # sha256sum 喺 $( ) 入面失敗唔會令步驟失敗,只會寫低一個空 sha ——
      # 缺 binary 就係咁樣靜靜咁溜到下游 job。先算好再檢查,唔准空值。
      - name: Record the fetched extensions commit
        if: env.QSAN_FULL_GUI_CI == 'true'
        run: |
          client_sha256=$(sha256sum relwithdebinfo/QSanguosha | cut -d' ' -f1)
          if [ -z "$client_sha256" ]; then
            echo "Refusing to publish a bundle with a missing binary" >&2
            exit 1
          fi
          {
            echo "repo_commit=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "qt_version=6.11.1"
            echo "build_type=RelWithDebInfo"
            echo "client_sha256=$client_sha256"
          } | tee build-provenance.txt

      - name: Upload the Linux GUI runtime bundle
        if: env.QSAN_FULL_GUI_CI == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-gui-runtime-bundle
          path: |
            relwithdebinfo/QSanguosha
            lua/
            extensions/
            tests/fixtures/media/
            build-provenance.txt
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------
  # Linux GUI M2B-A:Qt multimedia audio 同影片背景
  # ---------------------------------------------------------------------
  #
  # 呢個 job 唔會、亦唔應該要求真係聽到聲:GitHub runner 冇實體音訊裝置。
  # 通過條件係「backend 揀啱、media source 收得落、缺檔案／缺裝置有降級、
  # 影片路徑有明確分類、收得乾淨、冇 crash／hang」。
  gui-multimedia:
    name: Linux GUI M2B-A multimedia (Qt audio + video fallback)
    needs: gui-compile
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qt5compat qtmultimedia'
          cache: true
          cache-key-prefix: qt-ubuntu-24.04-x64-6.11.1-linux_gcc_64-qt5compat-qtmultimedia-aqtmaster16db45a7-v1
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'

      # 同 M1／M2 一樣的 runtime library,再加 Qt Multimedia 的 ffmpeg 後端會
      # dlopen 的 ALSA／PulseAudio client library。裝咗唔代表有音效卡 ——
      # runner 依然冇 /dev/snd,呢個 job 亦唔會要求有。
      - name: Install Linux GUI runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            alsa-utils \
            fonts-dejavu-core \
            libasound2t64 \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libpulse0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            xauth \
            xvfb

      - name: Download the Linux GUI runtime bundle
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v7.0.0
        with:
          name: linux-gui-runtime-bundle

      # multimedia smoke 唔使起伺服器,所以只還原 client 嘅執行權限。
      - name: Restore executable bits and report provenance
        run: |
          chmod +x relwithdebinfo/QSanguosha
          cat build-provenance.txt
          sha256sum relwithdebinfo/QSanguosha

      # 主驗證:Xvfb + xcb + software renderer。--expect-backend qt 令
      # 「Linux 靜靜地退返 null backend」變成失敗,而唔係一個綠色但冇意義的 job。
      - name: Linux GUI M2B-A multimedia smoke (Xvfb, xcb)
        run: |
          bash tools/ci/linux-gui-multimedia-smoke.sh \
            ./relwithdebinfo/QSanguosha \
            gui-multimedia-artifacts \
            --platform xcb \
            --label xvfb-xcb \
            --expect-backend qt \
            --expect-video-reason not_requested \
            --timeout-ms 60000 \
            --process-timeout 150

      # 影片降級路徑:特登指一個唔存在的 .mp4 做首頁背景,要求 GUI 分類成
      # asset_missing 並且真係換返靜態背景,而唔係啟動唔到。
      - name: Video background falls back to a static backdrop
        run: |
          bash tools/ci/linux-gui-multimedia-smoke.sh \
            ./relwithdebinfo/QSanguosha \
            gui-multimedia-artifacts \
            --platform xcb \
            --label video-missing \
            --expect-backend qt \
            --video-source tests/fixtures/media/no-such-clip.mp4 \
            --expect-video-reason asset_missing \
            --timeout-ms 60000 \
            --process-timeout 150

      # 次要 smoke:完全冇 X server(offscreen)亦要行得完,方便日後 container。
      - name: Linux GUI M2B-A multimedia smoke (offscreen, secondary)
        run: |
          bash tools/ci/linux-gui-multimedia-smoke.sh \
            ./relwithdebinfo/QSanguosha \
            gui-multimedia-artifacts \
            --platform offscreen \
            --label offscreen \
            --no-xvfb \
            --expect-backend qt \
            --timeout-ms 60000 \
            --process-timeout 150

      # 負向契約:app 內部 timeout 一定要回非零 exit code 同 timeout result marker,
      # 而唔係靜靜掛住等 runner 斬 —— 卡死嘅 media decoder 正正就係咁死。
      - name: Multimedia smoke timeout contract
        run: |
          bash tools/ci/linux-gui-multimedia-smoke.sh \
            ./relwithdebinfo/QSanguosha \
            gui-multimedia-artifacts \
            --platform offscreen \
            --label timeout-contract \
            --no-xvfb \
            --timeout-ms 100 \
            --process-timeout 150 \
            --expect fail \
            --expect-reason timeout

      - name: Upload M2B-A multimedia artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-gui-m2b-multimedia
          path: |
            gui-multimedia-artifacts/
            build-provenance.txt
          if-no-files-found: warn
          retention-days: 7

  # M2B-B:三個效果 profile 各跑一次 GUI runtime。三個都係 blocking —— 唔係
  # 「full 綠燈就算」:REDUCED／NONE 先至係新加嘅路徑,亦係最易靜靜壞咗嗰啲。
  #
  # 呢個 matrix 用嘅係 tests/fixtures/effects/ 嘅合成 fixture(一個 4x4 GIF、
  # 幾張 8x8 PNG、一個特登整壞嘅 Spine 目錄),唔需要任何正式美術資產。真正
  # 有齊資產嘅 production smoke 唔會喺 clean checkout 度成為 blocker ——
  # 見 docs/linux-gui-effects-profiles.md。
  gui-effects:
    name: Linux GUI M2B-B effects (${{ matrix.profile }} profile)
    needs: gui-compile
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [none, reduced, full]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qt5compat qtmultimedia'
          cache: true
          cache-key-prefix: qt-ubuntu-24.04-x64-6.11.1-linux_gcc_64-qt5compat-qtmultimedia-aqtmaster16db45a7-v1
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'

      - name: Install Linux GUI runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fonts-dejavu-core \
            libasound2t64 \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libpulse0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            xauth \
            xvfb

      - name: Download the Linux GUI runtime bundle
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v7.0.0
        with:
          name: linux-gui-runtime-bundle

      - name: Restore executable bits and report provenance
        run: |
          chmod +x relwithdebinfo/QSanguosha
          cat build-provenance.txt
          sha256sum relwithdebinfo/QSanguosha

      # 主驗證:Xvfb + xcb + software renderer,一個 profile 一次。
      # --profile 會同時做 --effects-profile,而 validator 要求 resolution
      # source 係 "cli" —— 靜靜退返設定值就會 fail,唔會扮成綠燈。
      - name: Linux GUI M2B-B effects smoke (Xvfb, xcb)
        run: |
          bash tools/ci/linux-gui-effects-smoke.sh \
            ./relwithdebinfo/QSanguosha \
            gui-effects-artifacts \
            --profile ${{ matrix.profile }} \
            --platform xcb \
            --label xvfb-${{ matrix.profile }} \
            --timeout-ms 60000 \
            --process-timeout 150

      # 次要 smoke:完全冇 X server(offscreen)亦要行得完,方便日後 container。
      - name: Linux GUI M2B-B effects smoke (offscreen, secondary)
        run: |
          bash tools/ci/linux-gui-effects-smoke.sh \
            ./relwithdebinfo/QSanguosha \
            gui-effects-artifacts \
            --profile ${{ matrix.profile }} \
            --platform offscreen \
            --label offscreen-${{ matrix.profile }} \
            --no-xvfb \
            --timeout-ms 60000 \
            --process-timeout 150

      # 負向契約:打錯 profile 名一定要即刻非零退出,唔可以靜靜當冇指定 ——
      # 否則整個 matrix 會變成「full 跑咗三次」。
      - name: An unknown effects profile is rejected
        run: |
          set +e
          ./relwithdebinfo/QSanguosha --effects-profile turbo --effects-smoke
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "An unknown --effects-profile value was accepted." >&2
            exit 1
          fi
          echo "rejected with exit code $status"

      # 負向契約:app 內部 timeout 一定要回非零 exit code 同 timeout result marker,
      # 而唔係靜靜掛住等 runner 斬。
      - name: Effects smoke timeout contract
        if: matrix.profile == 'none'
        run: |
          bash tools/ci/linux-gui-effects-smoke.sh \
            ./relwithdebinfo/QSanguosha \
            gui-effects-artifacts \
            --profile none \
            --platform offscreen \
            --label timeout-contract \
            --no-xvfb \
            --timeout-ms 100 \
            --process-timeout 150 \
            --expect fail \
            --expect-reason timeout

      - name: Upload M2B-B effects artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-gui-m2b-effects-${{ matrix.profile }}
          path: |
            gui-effects-artifacts/
            build-provenance.txt
          if-no-files-found: warn
          retention-days: 7

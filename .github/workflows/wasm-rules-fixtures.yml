name: WASM rules fixture probe

on:
  pull_request:
    branches: [debug, main]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/client/**'
      - 'src/core/**'
      - 'src/package/**'
      - 'src/scenario/**'
      - 'src/server/**'
      - 'src/util/**'
      - 'src/lua/**'
      - 'swig/**'
      - 'lua/**'
      - 'tests/client_runtime/**'
      - 'web/**'
      - 'tools/package-web-runtime.py'
      - 'tools/ci/requirements.txt'
      - '.github/workflows/wasm-rules-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-rules-fixtures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  parity:
    name: Qt 6.11.1 / Emscripten 4.0.7 native-WASM probe
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare evidence and build dependencies
        run: |
          mkdir -p artifacts/wasm-fixtures
          printf '{"schema_version":1,"status":"NOT_RUN"}\n' > artifacts/wasm-fixtures/parity-summary.json
          mkdir -p artifacts/wasm-fixtures/browser-probe
          printf '{"schema_version":1,"status":"NOT_RUN"}\n' > artifacts/wasm-fixtures/browser-probe/browser-parity-summary.json
          mkdir -p artifacts/wasm-fixtures/production-session
          printf '{"schema_version":1,"status":"NOT_RUN"}\n' > artifacts/wasm-fixtures/production-session/session-summary.json
          mkdir -p artifacts/wasm-fixtures/rules-bundle
          printf '{"schema_version":1,"status":"NOT_RUN"}\n' > artifacts/wasm-fixtures/rules-bundle/rules-bundle-summary.json
          mkdir -p artifacts/wasm-fixtures/rules-ingress
          printf '{"schema_version":1,"status":"NOT_RUN","browser":"NOT_RUN"}\n' > artifacts/wasm-fixtures/rules-ingress/ingress-summary.json
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build g++ python3-venv libgl1
          python3 -m venv "$RUNNER_TEMP/qsan-fixture-tools"
          "$RUNNER_TEMP/qsan-fixture-tools/bin/python" -m pip install --require-hashes -r tools/ci/requirements.txt
          echo "$RUNNER_TEMP/qsan-fixture-tools/bin" >> "$GITHUB_PATH"
      - name: Install native Qt
        uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebsockets
          dir: ${{ runner.temp }}/qsan-fixture-qt
          cache: true
          cache-key-prefix: qsan-native-fixtures-6.11.1-v1
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
      - name: Build the actual native baseline without any product frontend
        run: |
          set -o pipefail
          echo "QSAN_FIXTURE_HOST_QT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          cmake -S . -B build/rules-native -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DBUILD_TESTING=OFF -DQSAN_BUILD_GUI=OFF -DQSAN_BUILD_TUI=OFF \
            -DQSAN_BUILD_SERVER=ON -DQSAN_BUILD_RULES_FIXTURE_RUNNER=ON \
            -DQSAN_BUILD_RULES_SESSION_TESTS=ON \
            2>&1 | tee artifacts/wasm-fixtures/native-configure.log
          cmake --build build/rules-native --target qsanguosha_rules_fixture_runner qsanguosha_rules_session_probe qsanguosha_rules_ingress_probe qsanguosha_server \
            2>&1 | tee artifacts/wasm-fixtures/native-build.log
      - name: Execute native production-session lifecycle
        run: |
          python3 tests/client_runtime/check-rules-session.py --native-only \
            --native-runner "$GITHUB_WORKSPACE/build/rules-native/qsanguosha_rules_session_probe" \
            --asset-root "$GITHUB_WORKSPACE" --artifacts "$GITHUB_WORKSPACE/artifacts/wasm-fixtures/session-native"
      - name: Install the version-matched Emscripten SDK
        run: |
          git clone --depth 1 --branch 4.0.7 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.7
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.7
      - name: Install Qt WASM single-thread kit
        uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.11.1'
          host: all_os
          target: wasm
          arch: wasm_singlethread
          modules: qtwebsockets
          dir: ${{ runner.temp }}/qsan-fixture-qt
          cache: true
          cache-key-prefix: qsan-wasm-fixtures-6.11.1-singlethread-v1
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
      - name: Install Node host with native navigator support
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Run host adapter and comparison self-tests
        run: |
          echo "QSAN_FIXTURE_NODE=$(command -v node)" >> "$GITHUB_ENV"
          node --version > artifacts/wasm-fixtures/node-version.txt
          node --test tests/client_runtime/run-wasm-fixture.test.mjs tests/client_runtime/browser/fixture-worker-client.test.mjs
          python3 tests/client_runtime/check-browser-fixtures.py --self-test
          python3 tests/client_runtime/check-wasm-fixtures.py --self-test
          python3 tests/client_runtime/check-fixtures.py --self-test
          python3 tests/client_runtime/check-rules-session.py --self-test
          python3 tests/client_runtime/check-rules-bundle.py --self-test
          python3 tests/client_runtime/check-rules-ingress.py --self-test
      - name: Test production controller and type-check the production Worker
        run: |
          npm ci --prefix web
          node --experimental-vm-modules --test tests/client_runtime/rules-controller.test.mjs
          npm --prefix web test -- tests/rules-identity.test.ts
          node web/node_modules/typescript/bin/tsc web/src/rules-worker.ts \
            --noEmit --target ES2022 --module ES2022 --lib ES2022,DOM --strict --skipLibCheck
      - name: Compile and link the real engine for WASM
        run: |
          set -o pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          em++ --version > artifacts/wasm-fixtures/emscripten-version.txt
          cmake -S . -B build/rules-wasm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DQT_HOST_PATH="$QSAN_FIXTURE_HOST_QT" \
            -DBUILD_TESTING=OFF -DQSAN_BUILD_GUI=OFF -DQSAN_BUILD_TUI=OFF \
            -DQSAN_BUILD_SERVER=OFF -DQSAN_BUILD_RULES_FIXTURE_RUNNER=OFF \
            -DQSAN_BUILD_RULES_SESSION_TESTS=OFF -DQSAN_BUILD_WASM_WEB_CLIENT=ON \
            -DQSAN_BUILD_WASM_RULES_FIXTURES=ON \
            2>&1 | tee artifacts/wasm-fixtures/wasm-configure.log
          cmake --build build/rules-wasm --target qsanguosha_rules_fixture_wasm qsanguosha_rules_fixture_worker qsanguosha_client_wasm \
            2>&1 | tee artifacts/wasm-fixtures/wasm-build.log
      - name: Execute native raw-frame ingress and production WASM stream parity
        run: |
          set -o pipefail
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser" || { echo "Chromium is required for ingress acceptance" >&2; exit 1; }
          module_dir="$GITHUB_WORKSPACE/build/rules-wasm/web-wasm/RelWithDebInfo"
          python3 tests/client_runtime/check-rules-ingress.py \
            --native-runner "$GITHUB_WORKSPACE/build/rules-native/qsanguosha_rules_ingress_probe" \
            --wasm-module "$module_dir/qsanguosha_client_wasm.mjs" \
            --manifest "$module_dir/qsanguosha_client_wasm.assets.json" \
            --browser "$browser" --asset-root "$GITHUB_WORKSPACE" \
            --artifacts "$GITHUB_WORKSPACE/artifacts/wasm-fixtures/rules-ingress" \
            2>&1 | tee artifacts/wasm-fixtures/rules-ingress/gate.log
      - name: Execute matched-content native and WASM fixtures
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          module_dir="$GITHUB_WORKSPACE/build/rules-wasm/rules-wasm/RelWithDebInfo"
          python3 tests/client_runtime/check-wasm-fixtures.py \
            --native-runner "$GITHUB_WORKSPACE/build/rules-native/qsanguosha_rules_fixture_runner" \
            --wasm-module "$module_dir/qsanguosha_rules_fixture_wasm.mjs" \
            --manifest "$module_dir/qsanguosha_rules_fixture_wasm.assets.json" \
            --node "$QSAN_FIXTURE_NODE" --fixtures "$GITHUB_WORKSPACE/tests/client_runtime/fixtures" \
            --asset-root "$GITHUB_WORKSPACE" --artifacts "$GITHUB_WORKSPACE/artifacts/wasm-fixtures"
      - name: Execute real Chromium Dedicated Worker/native parity
        run: |
          set -o pipefail
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser" || { echo "Chromium is required for Worker acceptance" >&2; exit 1; }
          "$browser" --version > artifacts/wasm-fixtures/browser-probe/browser-version.txt
          module_dir="$GITHUB_WORKSPACE/build/rules-wasm/rules-wasm/RelWithDebInfo"
          python3 tests/client_runtime/check-browser-fixtures.py \
            --native-runner "$GITHUB_WORKSPACE/build/rules-native/qsanguosha_rules_fixture_runner" \
            --wasm-module "$module_dir/qsanguosha_rules_fixture_worker.mjs" \
            --manifest "$module_dir/qsanguosha_rules_fixture_worker.assets.json" \
            --browser "$browser" --fixtures "$GITHUB_WORKSPACE/tests/client_runtime/fixtures" \
            --asset-root "$GITHUB_WORKSPACE" \
            --artifacts "$GITHUB_WORKSPACE/artifacts/wasm-fixtures/browser-probe" \
            2>&1 | tee artifacts/wasm-fixtures/browser-probe/gate.log
      - name: Bundle the production Worker against the built deployment
        run: |
          module_dir="$GITHUB_WORKSPACE/build/rules-wasm/web-wasm/RelWithDebInfo"
          node web/scripts/build-rules-worker.mjs artifacts/wasm-fixtures/production-worker \
            "$module_dir/qsanguosha_client_wasm.bundle.json"
      - name: Execute real persistent production Worker/native session parity
        run: |
          set -o pipefail
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser"
          module_dir="$GITHUB_WORKSPACE/build/rules-wasm/web-wasm/RelWithDebInfo"
          python3 tests/client_runtime/check-rules-session.py \
            --native-runner "$GITHUB_WORKSPACE/build/rules-native/qsanguosha_rules_session_probe" \
            --wasm-module "$module_dir/qsanguosha_client_wasm.mjs" \
            --manifest "$module_dir/qsanguosha_client_wasm.assets.json" \
            --worker-script "$GITHUB_WORKSPACE/artifacts/wasm-fixtures/production-worker/rules-worker.js" \
            --browser "$browser" --asset-root "$GITHUB_WORKSPACE" \
            --artifacts "$GITHUB_WORKSPACE/artifacts/wasm-fixtures/production-session" \
            2>&1 | tee artifacts/wasm-fixtures/production-session/gate.log
      - name: Verify production rules identity and live admission
        run: |
          set -o pipefail
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser"
          runtime="$GITHUB_WORKSPACE/build/rules-wasm/web-wasm/RelWithDebInfo"
          python3 tools/package-web-runtime.py --module "$runtime/qsanguosha_client_wasm.mjs" --destination web/public/rules
          node web/scripts/build-rules-probe.mjs build/rules-browser-probe
          # Keep external server AI out of the source/WASM bootstrap tree.
          mkdir -p build/rules-server-ai
          bash tools/ci/fetch-extensions.sh "$GITHUB_WORKSPACE/build/rules-server-ai"
          python3 tests/client_runtime/check-rules-bundle.py \
            --server-ai-root "$GITHUB_WORKSPACE/build/rules-server-ai" \
            --native-runner "$GITHUB_WORKSPACE/build/rules-native/qsanguosha_rules_fixture_runner" \
            --server "$GITHUB_WORKSPACE/relwithdebinfo/qsanguosha_server" \
            --browser "$browser" --probe "$GITHUB_WORKSPACE/build/rules-browser-probe" \
            --runtime "$runtime" --artifacts "$GITHUB_WORKSPACE/artifacts/wasm-fixtures/rules-bundle" \
            2>&1 | tee artifacts/wasm-fixtures/rules-bundle-gate.log
      - name: Upload evidence even if compilation or parity fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-rules-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/wasm-fixtures/**
            build/rules-wasm/rules-wasm/**
            build/rules-wasm/web-wasm/**
            build/rules-wasm/CMakeCache.txt
            build/rules-native/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 7

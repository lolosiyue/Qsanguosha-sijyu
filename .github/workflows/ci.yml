name: Windows layered CI

on:
  pull_request:
    branches:
      - main
      - debug
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/client/**'
      - '!src/client/core/**'
      - 'src/client/core/**'
      - 'src/tui/**'
      - 'tests/tui/**'
      - 'artifacts/tui-flow-coverage.json'
      - 'tools/autotest/tui_network_smoke.py'
      - 'tools/autotest/tests/test_tui_network_smoke_contract.py'
      - 'src/core/audio.h'
      - 'src/core/json-gui.cpp'
      - 'src/core/oracle_helper.*'
      - 'src/core/record-analysis.*'
      - 'src/core/settings-gui.*'
      - 'src/dialog/**'
      - 'src/main.cpp'
      - 'src/pch.h'
      - 'src/spine/**'
      - 'src/ui/**'
      - 'src/util/**'
      - 'qml/**'
      - 'resource/**'
      - 'tools/ci/fetch-extensions.ps1'
      - 'tools/ci/requirements.txt'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 8
  QSAN_HEADLESS_PER_GAME_TIMEOUT: '3600'
  QSAN_NETWORK_GAME_TIMEOUT: '3600'

jobs:
  build:
    name: Build (RelWithDebInfo, VS2026/v145)
    runs-on: windows-2025-vs2026
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ci-logs -Force | Out-Null
          @(
            "runner=$env:RUNNER_OS"
            "image=$env:ImageOS"
            "image_version=$env:ImageVersion"
          ) | Set-Content -Path ci-logs\runner.txt

      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.11.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qt5compat qtmultimedia'
          cache: true
          cache-key-prefix: qt-windows-2025-x64-6.11.1-win64_msvc2022_64-qt5compat-qtmultimedia-aqtmaster16db45a7-v2
          # aqt 3.3.0 (最新 release) 不支援 Qt 6.11+ 的新 repo 目錄結構 (miurahr/aqtinstall#959)。
          # 修復已合併至 master 但未發佈；固定到此 commit 以取得 Qt 6.11+ 支援。
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'

      - name: Verify and record dependencies
        shell: pwsh
        run: |
          Start-Transcript -Path ci-logs\dependencies.log
          try {
            if (-not $env:QT_ROOT_DIR) {
              throw 'install-qt-action did not export QT_ROOT_DIR'
            }
            "QTDIR=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            $cmakeOutput = cmake --version | Out-String
            $cmakeOutput
            $cmakeMatch = [regex]::Match($cmakeOutput, 'cmake version ([0-9]+\.[0-9]+\.[0-9]+)')
            if (-not $cmakeMatch.Success -or [version]$cmakeMatch.Groups[1].Value -lt [version]'4.2.0') {
              throw "CMake 4.2 or newer is required: $cmakeOutput"
            }

            python -m pip install --disable-pip-version-check --require-hashes -r tools\ci\requirements.txt
            if ($LASTEXITCODE -ne 0) {
              throw "SWIG installation failed with exit code $LASTEXITCODE"
            }
            $swigOutput = swig -version | Out-String
            $swigOutput
            if ($swigOutput -notmatch 'SWIG Version 4\.3\.1') {
              throw "Expected SWIG 4.3.1: $swigOutput"
            }

            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vsPath) {
              throw 'Visual Studio with the x64 C++ toolchain was not found'
            }
            $toolsets = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Directory
            if (-not $toolsets) {
              throw "No MSVC compiler toolset was found below $vsPath"
            }
            ($toolsets | ForEach-Object FullName) -join "`n"

            $qtComponents = @('Qt6', 'Qt6Core5Compat', 'Qt6Multimedia')
            foreach ($component in $qtComponents) {
              $config = Join-Path $env:QT_ROOT_DIR "lib\cmake\$component\${component}Config.cmake"
              if (-not (Test-Path -LiteralPath $config)) {
                throw "Missing Qt component config: $config"
              }
              $config
            }
          }
          finally {
            Stop-Transcript
          }

      - name: Fetch Lua AI & extensions
        shell: pwsh
        run: |
          & .\tools\ci\fetch-extensions.ps1

      - name: Configure, build, and deploy RelWithDebInfo
        shell: pwsh
        run: |
          Start-Transcript -Path ci-logs\build.log
          try {
            cmake --preset vs2026-x64
            if ($LASTEXITCODE -ne 0) {
              throw "CMake configure failed with exit code $LASTEXITCODE"
            }
            cmake --build --preset relwithdebinfo-vs2026-x64
            if ($LASTEXITCODE -ne 0) {
              throw "RelWithDebInfo build failed with exit code $LASTEXITCODE"
            }
            cmake --build --preset deploy-relwithdebinfo-vs2026-x64
            if ($LASTEXITCODE -ne 0) {
              throw "GUI deployment failed with exit code $LASTEXITCODE"
            }
            cmake --build --preset deploy-server-relwithdebinfo-vs2026-x64
            if ($LASTEXITCODE -ne 0) {
              throw "Server deployment failed with exit code $LASTEXITCODE"
            }
            cmake --build --preset deploy-tui-relwithdebinfo-vs2026-x64
            if ($LASTEXITCODE -ne 0) {
              throw "TUI deployment failed with exit code $LASTEXITCODE"
            }
            cmake --build --preset deploy-tui-release
            if ($LASTEXITCODE -ne 0) {
              throw "Release TUI deployment failed with exit code $LASTEXITCODE"
            }

            $cache = 'builds\cmake-vs2026\CMakeCache.txt'
            Select-String -Path $cache -Pattern '^CMAKE_GENERATOR:INTERNAL=', '^CMAKE_GENERATOR_TOOLSET:INTERNAL=', '^Qt6_DIR:' |
              Set-Content -Path ci-logs\cmake-cache-proof.txt
            $compilerFiles = Get-ChildItem builds\cmake-vs2026\CMakeFiles -Filter CMakeCXXCompiler.cmake -Recurse
            Select-String -Path $compilerFiles.FullName -Pattern 'CMAKE_CXX_COMPILER_ID', 'CMAKE_CXX_COMPILER_VERSION' |
              Set-Content -Path ci-logs\compiler-proof.txt
          }
          finally {
            Stop-Transcript
          }

      - name: Stage build handoff artifacts
        shell: pwsh
        run: |
          $required = @(
            'relwithdebinfo\QSanguosha.exe',
            'relwithdebinfo\QSanguosha.pdb',
            'relwithdebinfo\qsanguosha_server.exe',
            'relwithdebinfo\qsanguosha_tui.exe',
            'dist\tui\RelWithDebInfo\qsanguosha_tui.exe'
          )
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            $required += 'builds\cmake-vs2026\CTestTestfile.cmake'
          }
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing required build output: $path"
            }
          }

          $runtimeStage = 'ci-handoff\runtime\release'
          New-Item -ItemType Directory -Path $runtimeStage -Force | Out-Null
          Get-ChildItem -Path relwithdebinfo -File |
            Where-Object Extension -In '.exe', '.dll' |
            Copy-Item -Destination $runtimeStage
          Copy-Item -LiteralPath relwithdebinfo\QSanguosha.pdb -Destination $runtimeStage
          Get-ChildItem -Path relwithdebinfo -Directory | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $runtimeStage -Recurse
          }
          # CTest 期望 relwithdebinfo 路徑，同步提供以修復 Not Run (qsanguosha_server_* 4 項)
          $relWithDebInfoStage = 'ci-handoff\runtime\relwithdebinfo'
          New-Item -ItemType Directory -Path $relWithDebInfoStage -Force | Out-Null
          Get-ChildItem -Path relwithdebinfo -File |
            Where-Object Extension -In '.exe', '.dll' |
            Copy-Item -Destination $relWithDebInfoStage
          Copy-Item -LiteralPath relwithdebinfo\QSanguosha.pdb -Destination $relWithDebInfoStage
          Get-ChildItem -Path relwithdebinfo -Directory | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $relWithDebInfoStage -Recurse
          }
          Copy-Item -LiteralPath dist\tui\RelWithDebInfo -Destination ci-handoff\runtime\tui -Recurse

          & dist\tui\RelWithDebInfo\qsanguosha_tui.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged TUI --version failed' }
          & dist\tui\RelWithDebInfo\qsanguosha_tui.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged TUI --help failed' }

          # 測試 target 定義喺 tests/ 子目錄，所以 MSVC 會將測試 exe 放喺
          # builds\cmake-vs2026\tests\RelWithDebInfo\，而唔係 build tree 根目錄。
          # 頂層 CTestTestfile.cmake 只有 subdirs("tests")，真正嘅 add_test() 喺
          # tests\CTestTestfile.cmake，兩個都要 stage，layout 亦要原樣保留
          # (生成嘅 CTestTestfile.cmake 內含絕對路徑)。
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            $ctestStage = 'ci-handoff\ctest\builds\cmake-vs2026'
            New-Item -ItemType Directory -Path "$ctestStage\tests\RelWithDebInfo" -Force | Out-Null
            Copy-Item -LiteralPath builds\cmake-vs2026\CTestTestfile.cmake -Destination $ctestStage
            Copy-Item -LiteralPath builds\cmake-vs2026\CMakeCache.txt -Destination $ctestStage
            New-Item -ItemType Directory -Path "$ctestStage\generated" -Force | Out-Null
            Copy-Item -LiteralPath builds\cmake-vs2026\generated\sanguosha_wrap.cxx -Destination "$ctestStage\generated"
            Copy-Item -LiteralPath builds\cmake-vs2026\tests\CTestTestfile.cmake -Destination "$ctestStage\tests"
            Copy-Item -Path builds\cmake-vs2026\tests\RelWithDebInfo\*.exe -Destination "$ctestStage\tests\RelWithDebInfo"
            if (-not (Get-ChildItem -Path "$ctestStage\tests\RelWithDebInfo" -Filter *.exe)) {
              throw 'No CTest executables were staged'
            }
          }

      - name: Run TUI live Protocol V2 gate
        shell: pwsh
        run: |
          cmake -S . -B builds\cmake-vs2026 -D BUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'TUI test reconfigure failed' }
          cmake --build builds\cmake-vs2026 --config RelWithDebInfo `
            --target qsanguosha_tui_contract_tests qsanguosha_tui_live_tcp_tests `
            --parallel 8
          if ($LASTEXITCODE -ne 0) { throw 'TUI test build failed' }
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          & builds\cmake-vs2026\tests\RelWithDebInfo\qsanguosha_tui_contract_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'TUI contract gate failed' }
          & builds\cmake-vs2026\tests\RelWithDebInfo\qsanguosha_tui_live_tcp_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'TUI live TCP gate failed' }

      - name: Run shared GUI and TUI client architecture regressions
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          New-Item -ItemType Directory -Path ci-logs -Force | Out-Null
          $capabilitiesPath = Join-Path $PWD 'ci-logs\gui-local-response-capabilities.json'
          $capabilitiesErrorPath = Join-Path $PWD 'ci-logs\gui-local-response-capabilities.stderr.log'
          $capabilitiesProcess = Start-Process `
            -FilePath (Resolve-Path 'relwithdebinfo\QSanguosha.exe').Path `
            -ArgumentList '--local-response-ui-capabilities' `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $capabilitiesPath `
            -RedirectStandardError $capabilitiesErrorPath
          if ($capabilitiesProcess.ExitCode -ne 0) {
            Get-Content $capabilitiesErrorPath -ErrorAction SilentlyContinue
            throw "GUI local-response capability probe failed: exit $($capabilitiesProcess.ExitCode)"
          }
          $capabilitiesText = Get-Content $capabilitiesPath -Raw
          $capabilities = $capabilitiesText | ConvertFrom-Json
          if ($capabilities.schema_version -ne 1 -or
              -not $capabilities.auto -or -not $capabilities.show -or
              -not $capabilities.inspect) {
            throw "Unexpected GUI local-response capabilities: $capabilitiesText"
          }
          & builds\cmake-vs2026\tests\RelWithDebInfo\qsanguosha_client_core_tests.exe `
            --interaction-generator relwithdebinfo\QSanguosha.exe `
            --interaction-matrix artifacts\client-core-interaction-matrix.json `
            --generated-interaction-matrix ci-logs\generated-client-core-interaction-matrix.json
          if ($LASTEXITCODE -ne 0) { throw 'Shared ClientCore production inventory failed' }
          & builds\cmake-vs2026\tests\RelWithDebInfo\qsanguosha_interaction_reply_adapter_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'GUI/TUI reply adapter contract failed' }
          & builds\cmake-vs2026\tests\RelWithDebInfo\qsanguosha_local_response_ui_case_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'GUI local-response case contract failed' }

      - name: Build and run Windows Debug TUI targeted gates
        shell: pwsh
        run: |
          cmake --build builds\cmake-vs2026 --config Debug `
            --target qsanguosha_tui qsanguosha_tui_contract_tests qsanguosha_tui_live_tcp_tests `
            --parallel 8
          if ($LASTEXITCODE -ne 0) { throw 'Windows Debug TUI targeted build failed' }
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          & builds\cmake-vs2026\tests\Debug\qsanguosha_tui_contract_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows Debug TUI contract failed' }
          & builds\cmake-vs2026\tests\Debug\qsanguosha_tui_live_tcp_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows Debug TUI live-session contract failed' }

      - name: Verify Windows Release TUI product
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist\tui\Release\qsanguosha_tui.exe')) {
            throw 'Release TUI package is missing'
          }
          & dist\tui\Release\qsanguosha_tui.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Windows Release TUI help smoke failed' }
          & dist\tui\Release\qsanguosha_tui.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows Release TUI version smoke failed' }

      - name: Upload Windows Release TUI product
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qsanguosha-tui-windows-release-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/tui/Release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload RelWithDebInfo runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-relwithdebinfo-v145-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-handoff/runtime
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload CTest bundle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctest-relwithdebinfo-v145-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-handoff/ctest
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/**
          if-no-files-found: warn
          retention-days: 7

  ctest:
    name: Windows CTest (main only)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025-vs2026
    # Feature／PR branch 只建置；CTest 僅允許在 main 執行。
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ci-logs -Force | Out-Null
          "runner=$env:RUNNER_OS`nimage=$env:ImageOS`nimage_version=$env:ImageVersion" |
            Set-Content -Path ci-logs\runner.txt

      - name: Download RelWithDebInfo runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-relwithdebinfo-v145-${{ github.sha }}-${{ github.run_attempt }}
          path: .

      - name: Download CTest bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ctest-relwithdebinfo-v145-${{ github.sha }}-${{ github.run_attempt }}
          path: .

      - name: Fetch Lua AI & extensions
        shell: pwsh
        run: |
          & .\tools\ci\fetch-extensions.ps1

      # qsanguosha_server / QSanguosha 的 RUNTIME_OUTPUT_DIRECTORY_RELWITHDEBINFO 係
      # source tree 的 relwithdebinfo\，所以生成的 CTestTestfile.cmake 會用該絕對路徑
      # 呼叫 server CLI 測試。runtime artifact 以 release\ 交付(其他 job 沿用該名稱)，
      # 喺呢度補一份 relwithdebinfo\ 令絕對路徑解析得到。
      - name: Restore RelWithDebInfo runtime layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path relwithdebinfo -Force | Out-Null
          Copy-Item -Path 'release\*' -Destination relwithdebinfo -Recurse -Force
          if (-not (Test-Path -LiteralPath 'relwithdebinfo\qsanguosha_server.exe')) {
            throw 'relwithdebinfo\qsanguosha_server.exe was not restored'
          }

      - name: Run deterministic C++ tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ci-logs -Force | Out-Null
          # 兼容部分階段僅提供 release 的情況，確保 CTest 指向的 relwithdebinfo 存在
          if ((Test-Path -LiteralPath release) -and -not (Test-Path -LiteralPath relwithdebinfo)) {
            New-Item -ItemType Directory -Path relwithdebinfo -Force | Out-Null
            Copy-Item -Path release\* -Destination relwithdebinfo -Recurse -Force
          }
          $runtime = if (Test-Path -LiteralPath release) { (Resolve-Path -LiteralPath release).Path } elseif (Test-Path -LiteralPath relwithdebinfo) { (Resolve-Path -LiteralPath relwithdebinfo).Path } else { throw 'Neither release nor relwithdebinfo runtime directory was found' }
          $env:PATH = "$runtime;$env:PATH"
          $runtime | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $junitPath = Join-Path $env:GITHUB_WORKSPACE 'ci-logs\ctest.xml'
          $ctestArguments = @(
            '--test-dir', 'builds\cmake-vs2026',
            '-C', 'RelWithDebInfo',
            '--output-on-failure',
            '--output-junit', $junitPath
          )
          Start-Transcript -Path ci-logs\ctest.log
          try {
            & ctest @ctestArguments
            if ($LASTEXITCODE -ne 0) {
              throw "CTest failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Stop-Transcript
          }

      - name: Consolidate crash evidence
        if: failure()
        shell: pwsh
        run: python tools\autotest\crash_report.py --exe-root . --log-dir artifacts\autotest --pdb release\QSanguosha.pdb

      - name: Upload CTest diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-ctest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/**
            artifacts/autotest/**
            dmp/**
            record/**
            release/**/*.dmp
            release/dmp/**
            release/record/**
          if-no-files-found: warn
          retention-days: 7


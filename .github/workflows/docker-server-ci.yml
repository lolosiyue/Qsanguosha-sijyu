name: Docker server CI

on:
  pull_request:
    branches:
      - main
      - debug
      # Linux GUI 的 milestone PR 係 stacked 喺 agent/linux-gui-* 上，base 唔係
      # main／debug。冇呢一行，stacked PR 就攞唔到 regression 證據。
      - 'agent/**'
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - '*.md'
  push:
    branches:
      - main
      - debug
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-server-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-packaging:
    name: Build and smoke-test final runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Docker Compose configuration
        run: docker compose --file compose.yaml config --quiet

      - name: Build and validate Docker packaging
        env:
          QSAN_DOCKER_IMAGE: qsanguosha-server:ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash tools/ci/docker-server-smoke.sh

      - name: Upload Docker diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/docker/**
          if-no-files-found: warn
          retention-days: 7

name: Linux server CI

on:
  pull_request:
    branches:
      - main
      - debug
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - '*.md'
  push:
    branches:
      - main
      - debug
    paths-ignore:
      - 'docs/**'
      - 'memory/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-server-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  QT_QPA_PLATFORM: offscreen
  QSAN_FULL_SERVER_CI: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  build-and-test:
    name: ${{ matrix.compiler.name }} server gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # PR 與 debug push 只建立 GCC job；main push／手動驗證才展開 GCC + Clang。
        compiler: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '[{"name":"GCC","id":"gcc","cc":"gcc","cxx":"g++","cxx_flags":"","package":"g++"},{"name":"Clang","id":"clang","cc":"clang","cxx":"clang++","cxx_flags":"-Wno-inconsistent-missing-override","package":"clang"}]' || '[{"name":"GCC","id":"gcc","cc":"gcc","cxx":"g++","cxx_flags":"","package":"g++"}]') }}

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare diagnostics
        run: mkdir -p ci-logs

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            cmake \
            ninja-build \
            python3-venv \
            qt6-5compat-dev \
            qt6-base-dev \
            qt6-websockets-dev \
            '${{ matrix.compiler.package }}'

      - name: Install pinned SWIG
        run: |
          python3 -m venv "$RUNNER_TEMP/qsanguosha-ci-venv"
          "$RUNNER_TEMP/qsanguosha-ci-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            -r tools/ci/requirements.txt
          echo "$RUNNER_TEMP/qsanguosha-ci-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/qsanguosha-ci-venv/bin/swig" -version

      - name: Fetch Lua AI and extensions
        run: bash tools/ci/fetch-extensions.sh "$GITHUB_WORKSPACE"

      - name: Configure with ${{ matrix.compiler.name }}
        run: |
          cmake -S . -B 'build/linux-${{ matrix.compiler.id }}' -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER='${{ matrix.compiler.cc }}' \
            -DCMAKE_CXX_COMPILER='${{ matrix.compiler.cxx }}' \
            -DCMAKE_CXX_FLAGS='${{ matrix.compiler.cxx_flags }}'

      - name: Build headless targets for debug push
        if: github.event_name == 'push' && github.ref == 'refs/heads/debug'
        run: |
          cmake --build 'build/linux-${{ matrix.compiler.id }}' \
            --target qsanguosha_server \
            --parallel
          cmake --build 'build/linux-${{ matrix.compiler.id }}' \
            --target \
              qsanguosha_tui \
              qsanguosha_protocol_v2_tests \
              qsanguosha_network_integration_tests \
              qsanguosha_tui_contract_tests \
              qsanguosha_tui_live_tcp_tests \
            --parallel

      - name: Build with ${{ matrix.compiler.name }}
        if: github.event_name != 'push' || github.ref != 'refs/heads/debug'
        run: cmake --build 'build/linux-${{ matrix.compiler.id }}' --parallel

      - name: Build and verify deploy-server
        if: env.QSAN_FULL_SERVER_CI == 'true'
        run: |
          cmake --build 'build/linux-${{ matrix.compiler.id }}' \
            --target deploy-server \
            --parallel
          test -x relwithdebinfo/qsanguosha_server
          test -d relwithdebinfo/lua
          test -f relwithdebinfo/lua/sanguosha.lua

      - name: Verify Linux install and systemd layout
        if: env.QSAN_FULL_SERVER_CI == 'true'
        run: |
          install_root="${RUNNER_TEMP}/qsanguosha-install-${{ matrix.compiler.id }}"
          cmake --install 'build/linux-${{ matrix.compiler.id }}' --prefix "$install_root"
          test -x "$install_root/bin/qsanguosha_server"
          test -x "$install_root/bin/qsanguosha_tui"
          "$install_root/bin/qsanguosha_tui" --version
          test -f "$install_root/lib/systemd/system/qsanguosha-server.service"
          test -f "$install_root/share/qsanguosha/lua/config.lua"
          test -d "$install_root/share/qsanguosha/extensions"

      # Level 2 覆蓋真實 TCP handshake／signup；Level 1 與 shutdown smoke 重疊，
      # Level 3 完整 02p 對局只留給 main 的 full CTest。
      - name: Run protocol V2 contract directly
        if: github.ref != 'refs/heads/main'
        run: 'build/linux-${{ matrix.compiler.id }}/tests/qsanguosha_protocol_v2_tests'

      - name: Run TUI Protocol V2 contract and live TCP gates
        run: |
          python3 -m py_compile tools/autotest/tui_network_smoke.py
          python3 tools/autotest/tests/test_tui_network_smoke_contract.py
          'build/linux-${{ matrix.compiler.id }}/tests/qsanguosha_tui_contract_tests'
          'build/linux-${{ matrix.compiler.id }}/tests/qsanguosha_tui_live_tcp_tests'

      - name: Prepare isolated TUI core-game runtime
        if: env.QSAN_FULL_SERVER_CI == 'true' && matrix.compiler.id == 'gcc'
        run: |
          tui_runtime="$RUNNER_TEMP/qsanguosha-tui-runtime"
          mkdir -p "$tui_runtime/extensions"
          ln -s "$GITHUB_WORKSPACE/lua" "$tui_runtime/lua"
          ln -s "$GITHUB_WORKSPACE/lang" "$tui_runtime/lang"
          : > "$tui_runtime/config.ini"
          echo "QSAN_TUI_RUNTIME=$tui_runtime" >> "$GITHUB_ENV"

      - name: Run production TUI deterministic complete game
        if: env.QSAN_FULL_SERVER_CI == 'true' && matrix.compiler.id == 'gcc'
        run: |
          python3 tools/autotest/tui_network_smoke.py \
            --exe-root "$GITHUB_WORKSPACE" \
            --mode 03_1v2 \
            --seed 20260831 \
            --workdir "$QSAN_TUI_RUNTIME" \
            --artifact-dir ci-logs/tui-real-complete

      - name: Run production TUI mid-game reconnect and finish
        if: env.QSAN_FULL_SERVER_CI == 'true' && matrix.compiler.id == 'gcc'
        run: |
          python3 tools/autotest/tui_network_smoke.py \
            --exe-root "$GITHUB_WORKSPACE" \
            --mode 03_1v2 \
            --seed 20260831 \
            --reconnect \
            --workdir "$QSAN_TUI_RUNTIME" \
            --artifact-dir ci-logs/tui-real-reconnect

      - name: Run daily network integration level 2
        if: env.QSAN_FULL_SERVER_CI != 'true'
        run: |
          'build/linux-${{ matrix.compiler.id }}/tests/qsanguosha_network_integration_tests' \
            --level 2 \
            --server "$GITHUB_WORKSPACE/relwithdebinfo/qsanguosha_server" \
            | tee 'ci-logs/network-level2-${{ matrix.compiler.id }}.log'

      - name: Run full CTest including network E2E
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ci-logs
          ctest \
            --test-dir 'build/linux-${{ matrix.compiler.id }}' \
            --build-config RelWithDebInfo \
            --output-on-failure \
            --output-junit 'ci-logs/ctest-${{ matrix.compiler.id }}.xml'

      - name: Verify ephemeral TCP connect and clean SIGTERM shutdown
        run: |
          bash tools/ci/server-shutdown-smoke.sh \
            relwithdebinfo/qsanguosha_server \
            'ci-logs/server-shutdown-${{ matrix.compiler.id }}.log'

      - name: Upload Linux diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-server-${{ matrix.compiler.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/**
          if-no-files-found: warn
          retention-days: 7

<!doctype html>
<html><head><base target="_top"><style>
body{font:13px Arial,sans-serif;padding:10px;color:#202124}h3{margin:0 0 8px}h4{margin:14px 0 4px;font-size:12px;font-weight:bold;color:#5f6368;letter-spacing:.08em}label{display:block;margin-top:8px}input,select,button{box-sizing:border-box;width:100%;margin-top:3px;padding:6px}button{cursor:pointer}button.primary{background:#1a73e8;color:#fff;border:1px solid #1a73e8}button.danger{color:#b31412;border:1px solid #b31412;background:#fff}details{margin-top:4px}summary{cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:4px}.status{white-space:pre-wrap;background:#f1f3f4;padding:8px;margin-top:8px;min-height:32px}.error{color:#b31412}.ok{color:#137333}.muted{color:#5f6368;font-size:12px}img{max-width:100%;max-height:180px;margin-top:8px}
</style></head><body>
<h3><?= qsanText_('sidebarHeading') ?></h3><div class="muted"><?= qsanText_('sidebarIntro') ?></div>
<h4><?= qsanText_('secConnect') ?></h4>
<details id="pair-box" open><summary><?= qsanText_('pairDetails') ?> <span id="pair-state" class="muted"></span></summary>
<label><?= qsanText_('endpointLabel') ?><input id="endpoint" autocomplete="url" placeholder="https://…"></label>
<label><?= qsanText_('pairCodeLabel') ?><input id="code" autocomplete="one-time-code"></label>
<button class="primary" onclick="pairNow()"><?= qsanText_('btnPair') ?></button></details>
<button onclick="invoke('abandonPair','<?= qsanText_('okClearPair') ?>')"><?= qsanText_('btnClearPair') ?></button>
<h4><?= qsanText_('secRoom') ?></h4>
<div class="grid"><button onclick="invoke('hostFromSheet','<?= qsanText_('okHost') ?>')"><?= qsanText_('btnHost') ?></button><button onclick="invoke('connectFromSheet','<?= qsanText_('okConnect') ?>')"><?= qsanText_('secConnect') ?></button><button onclick="invoke('readyFromSheet','<?= qsanText_('okReady') ?>')"><?= qsanText_('btnReady') ?></button><button onclick="invoke('unreadyFromSheet','<?= qsanText_('okUnready') ?>')"><?= qsanText_('btnUnready') ?></button><button onclick="invoke('addRobotFromSheet','<?= qsanText_('okRobot') ?>')"><?= qsanText_('btnAddRobot') ?></button><button onclick="invoke('reconnect','<?= qsanText_('okReconnect') ?>')"><?= qsanText_('btnReconnect') ?></button></div>
<div class="muted"><?= qsanText_('chatHint') ?></div><button onclick="invoke('chatFromSheet','<?= qsanText_('okChat') ?>')"><?= qsanText_('btnChat') ?></button>
<h4><?= qsanText_('secActions') ?></h4>
<div class="grid"><button class="primary" onclick="invoke('previewSheetDraft','<?= qsanText_('okPreview') ?>')"><?= qsanText_('btnPreview') ?></button><button class="primary" onclick="invoke('submitSheetDraft','<?= qsanText_('okSubmit') ?>')"><?= qsanText_('btnSubmit') ?></button><button onclick="invoke('cancelDraft','<?= qsanText_('okCancel') ?>')"><?= qsanText_('btnCancel') ?></button><button class="danger" onclick="invoke('surrenderFromSheet','<?= qsanText_('okSurrender') ?>')"><?= qsanText_('btnSurrender') ?></button><button onclick="invoke('trustFromSheet','<?= qsanText_('okTrust') ?>')"><?= qsanText_('btnTrust') ?></button><button onclick="invoke('untrustFromSheet','<?= qsanText_('okUntrust') ?>')"><?= qsanText_('btnUntrust') ?></button></div>
<h4><?= qsanText_('secQuery') ?></h4>
<div class="muted"><?= qsanText_('pickHint') ?></div>
<div class="grid"><button onclick="invoke('detailsFromSheet','<?= qsanText_('okDetails') ?>')"><?= qsanText_('btnDetails') ?></button><button onclick="invoke('catalogFromSheet','<?= qsanText_('okCatalog') ?>')"><?= qsanText_('menuCatalog') ?></button></div>
<button onclick="invoke('setupWorkbook','<?= qsanText_('okSetup') ?>')"><?= qsanText_('menuSetup') ?></button>
<h4><?= qsanText_('secUpdates') ?></h4>
<div class="grid"><button onclick="startPolling()"><?= qsanText_('btnStart') ?></button><button id="stop-updates" onclick="stopPolling()"><?= qsanText_('btnStop') ?></button></div>
<button onclick="invoke('retryPending','<?= qsanText_('okRetry') ?>')"><?= qsanText_('menuRetry') ?></button><button class="danger" onclick="leave()"><?= qsanText_('btnLeave') ?></button>
<div id="status" class="status"><?= qsanText_('stateLoading') ?></div><div id="detailText" class="status" hidden></div><img id="detailImage" hidden alt="<?= qsanText_('detailAlt') ?>">
<script>
let inflight=false,timer=null,epoch=0,backoff=2000,polling=false,lastError='',lastErrorKind='';
const $=id=>document.getElementById(id);
// Stopping polling stays reachable while a Google request is in flight.
function busy(v){inflight=v;document.querySelectorAll('button').forEach(b=>{if(b.id!=='stop-updates')b.disabled=v})}
function show(x,f,kind){
  let text=typeof x==='string'?x:(x&&x.error)||(x&&x.lastError)||(x&&x.status)||f||"<?= qsanText_('doneOk') ?>";
  if(x&&x.gameOver)text='GAME_OVER\n'+"<?= qsanText_('winnerPrefix') ?>"+(x.winner||"<?= qsanText_('winnerUnknown') ?>");
  else if(x&&x.prompt)text+='\n'+x.prompt;
  if(x&&(x.error||x.lastError)){
    const errorKind=kind||'action';
    if(errorKind!=='poll'||(lastErrorKind!=='action'&&lastErrorKind!=='pending')){lastError=x.error||x.lastError;lastErrorKind=errorKind;}
  }
  $('status').textContent=lastError?lastError+'\n'+text:text;
  $('status').className='status '+(lastError?'error':'ok');
  if(x&&Object.prototype.hasOwnProperty.call(x,'detailText')){
    $('detailText').textContent=x.detailText||'';
    $('detailText').hidden=!x.detailText;
  }
  if(x&&Object.prototype.hasOwnProperty.call(x,'detailImage')){
    const image=x.detailImage||'';
    $('detailImage').hidden=!/^data:image\/(png|jpeg|gif);base64,/.test(image);
    if(!$('detailImage').hidden)$('detailImage').src=image;
  }
}
function schedule(){if(timer)clearTimeout(timer);timer=null;if(polling&&!inflight)timer=setTimeout(tick,backoff)}
function call(name,args,onOk,isPoll){
  if(inflight)return;if(timer)clearTimeout(timer);timer=null;busy(true);const serial=epoch;
  google.script.run.withSuccessHandler(x=>{
    busy(false);if(serial!==epoch){schedule();return;}
    backoff=2000;
    if(isPoll&&x&&x.state&&x.state.pending){lastError="<?= qsanText_('pollPending') ?>";lastErrorKind='pending';}
    else if(isPoll&&lastErrorKind==='poll'){lastError='';lastErrorKind='';}
    else if(!isPoll){lastError='';lastErrorKind='';}
    (onOk||show)(x);schedule();
  }).withFailureHandler(e=>{
    busy(false);if(serial!==epoch){schedule();return;}
    backoff=Math.min(backoff*2,30000);show({error:e.message||String(e)},undefined,isPoll?'poll':'action');schedule();
  })[name].apply(null,args||[]);
}
function invoke(name,f){call(name,[],x=>show(x,f),false)}
function pairState(x){$('pair-box').open=!x.paired;$('pair-state').textContent=x.paired?"<?= qsanText_('pairedLine') ?>"+String(x.endpoint||'').replace(/^https:\/\//,''):''}
function pairNow(){call('pair',[$('endpoint').value,$('code').value],x=>{show(x,"<?= qsanText_('pairOk') ?>");$('code').value='';pairState(x);polling=!!x.paired;},false)}
function tick(){timer=null;if(polling)call('poll',[],x=>show(x,"<?= qsanText_('updated') ?>"),true)}
function startPolling(){polling=true;schedule()}
function stopPolling(){polling=false;epoch++;if(timer)clearTimeout(timer);timer=null;show("<?= qsanText_('updatesStopped') ?>")}
function leave(){if(inflight)return;stopPolling();call('disconnect',[],x=>{if(x&&x.ok!==false)pairState({paired:false,endpoint:x.endpoint||''});show(x&&x.ok===false?x:"<?= qsanText_('sessionClosed') ?>")},false)}
call('getClientState',[],s=>{if(s.endpoint)$('endpoint').value=s.endpoint;pairState(s);polling=!!s.paired;show(s,s.paired?"<?= qsanText_('resuming') ?>":"<?= qsanText_('pairRequired') ?>");},false);
</script></body></html>
